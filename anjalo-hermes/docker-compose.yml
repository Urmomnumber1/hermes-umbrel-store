version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anjalo-hermes_requests_1
      APP_PORT: 3000
      # The request page has no login by design (guests use it).
      PROXY_AUTH_ADD: "false"

  # Song request page + queue. A worker on the owner's PC (Claude Code) picks requests up.
  requests:
    image: node:22-alpine
    command: node /app/server.js
    restart: on-failure
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ${APP_DATA_DIR}/requests-app:/app:ro
      - ${APP_DATA_DIR}/requests-data:/data
    ports:
      # Guest-facing page at http://<umbrel-ip>:3340 (LAN only)
      - "3340:3000"
