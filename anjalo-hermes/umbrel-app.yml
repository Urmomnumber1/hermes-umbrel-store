id: anjalo-hermes
category: media
name: Hermes Music
version: "3.16.0"
tagline: Request a song and it lands in your music library
description: >-
  A song request page for your household. Anyone on your network types a song, album (/album) or artist (/artist), and Hermes Music
  finds it on YouTube Music, downloads it and saves it into your Umbrel music folder
  (Home > Downloads > music in the Files app) so Navidrome and Feishin can play it.


  Songs are identified by Claude Code (with your Claude subscription, using a token from "claude setup-token")
  or by a local model on any OpenAI-compatible server (Ollama, llama.cpp, LM Studio). Set this up in the Config tab.
  Everything runs on your Umbrel.
releaseNotes: "For Sour Player 0.15: song versions. Other versions of a song (covers, sped-up edits...) live under it in a hidden folder Navidrome does not scan, so the library shows the song once. Versions come from requests (a link or a few words), from admins putting one song under another, and by themselves from singles that are clearly another version of a song you have. Hermes times each version against the original by matching the sound, so Sour Player can switch between them mid-song or play two at once. Also: no karaoke for songs nobody sings in."
