id: anjalo-hermes
category: media
name: Hermes Music
version: "3.10.2"
tagline: Request a song and it lands in your music library
description: >-
  A song request page for your household. Anyone on your network types a song, album (/album) or artist (/artist), and Hermes Music
  finds it on YouTube Music, downloads it and saves it into your Umbrel music folder
  (Home > Downloads > music in the Files app) so Navidrome and Feishin can play it.


  Songs are identified by Claude Code (with your Claude subscription, using a token from "claude setup-token")
  or by a local model on any OpenAI-compatible server (Ollama, llama.cpp, LM Studio). Set this up in the Config tab.
  Everything runs on your Umbrel.
releaseNotes: "For Sour Player 0.10.2: the Sour Shop (a point for every song you listen to, spent on profile looks), Config is for admins now (sign in with your Navidrome admin account; the old PIN still works), AI karaoke that splits the vocals off any song in the library when YouTube has no instrumental (free, runs on the Umbrel, about 1-2 GB the first time), Describe it and lyrics search instead of humming search, and many fixes (Group Play game winners, storage and lyrics doctor speed, and more)."
