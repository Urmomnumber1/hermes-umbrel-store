manifestVersion: 1
id: anjalo-hermes
category: media
name: Hermes Music
version: "1.0.1"
tagline: Request a song and it lands in your music library
description: >-
  A simple song request page. Anyone on your network types a song name; a helper running
  Claude Code finds it on YouTube Music, downloads it, and drops it into your music library
  (Navidrome / Feishin).


  This app is only the request page and queue. The helper is a small script that runs on your
  own computer (see the store's README).
releaseNotes: Request-only app. Removed the bundled Hermes container.
