id: anjalo-hermes
category: media
name: Hermes Music
version: "3.0.0"
tagline: Request a song and it lands in your music library
description: >-
  A song request page for your household. Anyone on your network types a song, album (/album) or artist (/artist), and Hermes Music
  finds it on YouTube Music, downloads it and saves it into your Umbrel music folder
  (Home > Downloads > music in the Files app) so Navidrome and Feishin can play it.


  Songs are identified by Claude Code (with your Claude subscription, using a token from "claude setup-token")
  or by a local model on any OpenAI-compatible server (Ollama, llama.cpp, LM Studio). Set this up in the Config tab.
  Everything runs on your Umbrel.
releaseNotes: "Big update for Sour Player 0.3: always-on stations (Sour Radio, Chill, Hype, Throwbacks, Sleep) and your own rooms, Group Play chat, reactions, upvotes, DJ rotation, guessing game and DJ shows, profile walls, dedications, nicknames, stats, the weekly leaderboard, song of the day, milestones and a friend group page. Requests can be upvoted or pasted as a screenshot, new releases from followed artists download by themselves, songs come with synced lyrics, and /issues finds and fixes songs with missing tags, covers or low quality. Also fixes people being counted twice in Group Play."
