id: anjalo-hermes
category: media
name: Hermes Music
version: "3.1.0"
tagline: Request a song and it lands in your music library
description: >-
  A song request page for your household. Anyone on your network types a song, album (/album) or artist (/artist), and Hermes Music
  finds it on YouTube Music, downloads it and saves it into your Umbrel music folder
  (Home > Downloads > music in the Files app) so Navidrome and Feishin can play it.


  Songs are identified by Claude Code (with your Claude subscription, using a token from "claude setup-token")
  or by a local model on any OpenAI-compatible server (Ollama, llama.cpp, LM Studio). Set this up in the Config tab.
  Everything runs on your Umbrel.
releaseNotes: "For Sour Player 0.4: profiles now follow your Navidrome account (sign in once, same profile on every computer, duplicates merge by themselves). New social features: gifts, time capsules, sticky notes on songs, song duels and a Hall of Fame, the daily hot seat, play-this-next asks, an activity feed, duo stats, listening heatmaps, monthly eras, profile visits (opt-in), recap nights and a colour of the day vote. Group Play gets encores, a soundboard, skip-the-line tokens, a request line, blind rounds, theme nights, room looks, a 3-2-1 countdown, spectators, reactions pinned to moments and session summaries in a scrapbook. Library tools for tags, covers, timed lyrics, archiving and ten-song mood bundles. Emoji no longer get cut in half. Config has a Navidrome address (found by itself on Umbrel)."
