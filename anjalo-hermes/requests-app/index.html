<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes Music</title>
<link rel="icon" href="https://raw.githubusercontent.com/Urmomnumber1/hermes-umbrel-store/main/anjalo-hermes/icon.png">
<style>
:root{color-scheme:dark;--bg:#05080f;--panel:#0a1120;--fg:#cfe0ff;--mut:#5f7aa8;--acc:#3b82f6;--hi:#bfdbfe;--bd:#1b3560}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
main{max-width:640px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 2px;font-size:1.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hi)}
.sub{color:var(--mut);margin:0 0 24px;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem}
.box{border:1px solid var(--bd);background:var(--panel)}
form{display:flex;align-items:center;padding:0 0 0 12px}
form span{color:var(--acc)}
input{flex:1;min-width:0;padding:14px 10px;border:0;outline:0;background:transparent;color:var(--fg);font:inherit}
input::placeholder{color:var(--mut)}
button{align-self:stretch;padding:0 18px;border:0;border-left:1px solid var(--bd);background:transparent;color:var(--acc);font:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:hover{background:var(--acc);color:#fff}
#msg{color:var(--mut);min-height:1.5em;margin:10px 0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;padding:10px 12px;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
.s{flex:none;width:7.5em;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;padding-top:2px;color:var(--mut)}
.done{color:#4ade80}.failed{color:#f87171}.working{color:var(--acc)}
small{display:block;color:var(--mut)}
.empty{padding:14px 12px;color:var(--mut)}
</style></head><body><main>
<h1>Hermes Music</h1>
<p class="sub">Request a song</p>
<div class="box"><form id="f"><span>&#10095;</span><input id="q" placeholder="song name and artist" maxlength="200" required autofocus autocomplete="off"><button>Request</button></form></div>
<p id="msg"></p>
<div class="box"><ul id="l"></ul></div>
</main>
<script>
const l = document.getElementById("l"), msg = document.getElementById("msg"), q = document.getElementById("q");
const label = { pending: "queued", working: "downloading", done: "added", failed: "failed" };
async function load() {
  const r = await (await fetch("api/requests")).json();
  l.innerHTML = "";
  if (!r.length) { const e = document.createElement("li"); e.className = "empty"; e.textContent = "No requests yet."; l.append(e); return; }
  for (const i of r) {
    const li = document.createElement("li");
    const s = document.createElement("span");
    s.className = "s " + i.status;
    s.textContent = label[i.status] || i.status;
    const a = document.createElement("div");
    a.textContent = i.title ? (i.artist ? i.artist + " - " : "") + i.title : i.query;
    if (i.note) { const n = document.createElement("small"); n.textContent = i.note; a.append(n); }
    li.append(s, a);
    l.append(li);
  }
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("api/requests", { method: "POST", body: JSON.stringify({ query: q.value }) });
  const j = await r.json();
  msg.textContent = r.ok ? "Requested. It will show up in the library soon." : j.error;
  if (r.ok) q.value = "";
  load();
};
load(); setInterval(load, 5000);
</script></body></html>
