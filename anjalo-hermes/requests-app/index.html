<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Song Requests</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#1a1a1a;--card:#fff;--mut:#777;--acc:#6d4aff;--bd:#e3e3e3}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--fg:#eee;--card:#1e1e22;--mut:#999;--bd:#333}}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:560px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem}form{display:flex;gap:8px}
input{flex:1;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:1rem;min-width:0}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:1rem;cursor:pointer}
ul{list-style:none;padding:0}
li{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px}
small{color:var(--mut)}
.s{font-size:.8rem;white-space:nowrap}.done{color:#1a9c4a}.failed{color:#d33}.working{color:var(--acc)}
#msg{color:var(--mut);min-height:1.2em}
</style></head><body><main>
<h1>Request a song</h1>
<form id="f"><input id="q" placeholder="Song name and artist" maxlength="200" required autofocus><button>Request</button></form>
<p id="msg"></p><ul id="l"></ul></main>
<script>
const l = document.getElementById("l"), msg = document.getElementById("msg"), q = document.getElementById("q");
const label = { pending: "Queued", working: "Downloading", done: "Added", failed: "Failed" };
async function load() {
  const r = await (await fetch("api/requests")).json();
  l.innerHTML = "";
  for (const i of r) {
    const li = document.createElement("li");
    const a = document.createElement("div");
    a.textContent = i.title ? (i.artist ? i.artist + " - " : "") + i.title : i.query;
    if (i.note) {
      const n = document.createElement("small");
      n.textContent = i.note;
      a.append(document.createElement("br"), n);
    }
    const s = document.createElement("span");
    s.className = "s " + i.status;
    s.textContent = label[i.status] || i.status;
    li.append(a, s);
    l.append(li);
  }
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("api/requests", { method: "POST", body: JSON.stringify({ query: q.value }) });
  const j = await r.json();
  msg.textContent = r.ok ? "Requested! Hermes is on it." : j.error;
  if (r.ok) q.value = "";
  load();
};
load(); setInterval(load, 5000);
</script></body></html>
